name: Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "test/**"
      - "package.json"
      - "aliucord/plugins/E2EEDiscord/src/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "package.json"
      - "aliucord/plugins/E2EEDiscord/src/**"

jobs:
  test:
    name: Core tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Test
        run: npm test
